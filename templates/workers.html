{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('dashboard') }}" class="inline-flex items-center text-sm text-gray-400 hover:text-amber-400 mb-4">
    ← Back to Dashboard
</a>
<div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold">Worker Management</h2>
    <a href="{{ url_for('workers.add_worker') }}" class="bg-amber-600 hover:bg-amber-700 px-4 py-2 rounded">+ Add Worker</a>
</div>

<div class="overflow-x-auto">
<table class="w-full bg-gray-800 rounded-lg overflow-hidden">
    <thead class="bg-gray-700 text-left text-sm text-gray-400">
        <tr><th class="p-3">Name</th><th class="p-3">Zone</th><th class="p-3">Status</th><th class="p-3"></th></tr>
    </thead>
    <tbody>
        {% for worker in workers %}
        <tr class="border-t border-gray-700">
            <td class="p-3">{{ worker.name }}</td>
            <td class="p-3">{{ worker.zone.name }}</td>
            <td class="p-3">
                <span class="px-2 py-1 rounded text-xs
                    {% if worker.status == 'safe' %}bg-teal-900 text-teal-300
                    {% elif worker.status == 'alert' %}bg-amber-900 text-amber-300
                    {% elif worker.status == 'evacuated' %}bg-red-900 text-red-300
                    {% else %}bg-gray-700 text-gray-400{% endif %}">
                    {{ worker.status }}
                </span>
            </td>
            <td class="p-3 text-right">
                <a href="{{ url_for('workers.edit_worker', worker_id=worker.id) }}" class="text-teal-400 hover:underline text-sm mr-3">Edit</a>
                <form method="POST" action="{{ url_for('workers.delete_worker', worker_id=worker.id) }}" class="inline" onsubmit="return confirm('Remove {{ worker.name }}?')">
                    <button type="submit" class="text-red-400 hover:underline text-sm">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
