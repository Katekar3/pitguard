<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — PitGuard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    @keyframes drillDescend {
        0% { transform: translateY(-40vh) rotate(0deg); }
        100% { transform: translateY(30vh) rotate(1080deg); }
    }
    @keyframes screenShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
    }
    @keyframes dustParticle {
        0% { transform: translate(0,0) scale(1); opacity: 0.8; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    #drill-bit.drilling {
        animation: drillDescend 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards, screenShake 0.15s ease-in-out 8;
    }
    .dust-particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #a8a29e;
        border-radius: 50%;
        animation: dustParticle 0.6s ease-out forwards;
    }
    .rock-band {
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .rock-band.cracked {
        opacity: 0;
        transform: translateY(20px);
    }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap justify-between items-center gap-y-2">
    <span class="text-xl font-bold text-amber-500">⛏ PitGuard</span>
    {% if session.get('user_id') %}
    <div class="flex flex-wrap gap-3 sm:gap-4 text-sm">
        <a href="{{ url_for('dashboard') }}" class="text-gray-300 hover:text-amber-500">Dashboard</a>
        <a href="{{ url_for('workers.list_workers') }}" class="hover:text-amber-400">Workers</a>
        <a href="{{ url_for('analytics.alert_history') }}" class="hover:text-amber-400">History</a>
        {% if session.get('role') == 'admin' %}
        <a href="{{ url_for('users.list_users') }}" class="hover:text-amber-400">Users</a>
        {% endif %}
        <a href="{{ url_for('logout') }}" class="text-gray-300 hover:text-red-400">Logout</a>
    </div>
    {% endif %}
    </nav>
    <main class="p-6">
        {% block content %}{% endblock %}
    </main>

    <div id="drill-overlay" class="fixed inset-0 bg-black z-50 hidden flex-col items-center justify-center overflow-hidden">
    <div id="tunnel-wrap" style="perspective: 500px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
        <div id="tunnel-rings" style="position:relative; width:100%; height:100%; transform-style:preserve-3d;"></div>
    </div>

    <div id="center-glow" class="absolute w-40 h-40 rounded-full pointer-events-none"
         style="background: radial-gradient(circle, rgba(245,158,11,0.5) 0%, transparent 70%); filter: blur(20px);"></div>

    <svg id="drill-svg" width="90" height="90" viewBox="0 0 100 100" class="relative z-10">
    <defs>
        <radialGradient id="crownGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fde68a"/>
            <stop offset="45%" stop-color="#d97706"/>
            <stop offset="100%" stop-color="#5b2e05"/>
        </radialGradient>
        <radialGradient id="hubGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#92400e"/>
            <stop offset="100%" stop-color="#1c0a00"/>
        </radialGradient>
    </defs>

    <g id="drill-spin" style="transform-origin: 50px 50px;">
        <circle cx="50" cy="50" r="34" fill="url(#crownGrad)" stroke="#451a03" stroke-width="1.5"/>

        <g fill="#78350f" stroke="#1c0a00" stroke-width="0.5">
            <polygon points="50,6 45,16 55,16"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(30 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(60 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(90 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(120 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(150 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(180 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(210 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(240 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(270 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(300 50 50)"/>
            <polygon points="50,6 45,16 55,16" transform="rotate(330 50 50)"/>
        </g>

        <g stroke="#451a03" stroke-width="2" fill="none" opacity="0.55">
            <path d="M50,50 C43,42 41,26 50,14"/>
            <path d="M50,50 C43,42 41,26 50,14" transform="rotate(60 50 50)"/>
            <path d="M50,50 C43,42 41,26 50,14" transform="rotate(120 50 50)"/>
            <path d="M50,50 C43,42 41,26 50,14" transform="rotate(180 50 50)"/>
            <path d="M50,50 C43,42 41,26 50,14" transform="rotate(240 50 50)"/>
            <path d="M50,50 C43,42 41,26 50,14" transform="rotate(300 50 50)"/>
        </g>

        <ellipse cx="38" cy="34" rx="10" ry="16" fill="#fde68a" opacity="0.25"/>

        <circle cx="50" cy="50" r="10" fill="url(#hubGrad)" stroke="#000" stroke-width="1"/>
        <circle cx="46" cy="46" r="2" fill="#fde68a" opacity="0.5"/>
    </g>
    </svg>

    <div id="dust-container" class="absolute inset-0 pointer-events-none"></div>
    <div id="vignette" class="absolute inset-0 pointer-events-none"
         style="background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.85) 100%);"></div>

    <div class="absolute bottom-16 flex flex-col items-center gap-3 z-10">
        <p class="text-amber-500 text-sm tracking-widest uppercase" id="depth-label">Descending</p>
        <div class="w-64 h-1.5 bg-gray-800 rounded-full overflow-hidden">
            <div id="depth-fill" class="h-full bg-amber-500 rounded-full" style="width: 0%;"></div>
        </div>
        <p class="text-gray-600 text-xs mt-4">Press any key to skip</p>
    </div>

    <div id="breakthrough-flash" class="absolute inset-0 bg-amber-400 opacity-0 pointer-events-none z-20"></div>

    <audio id="drill-audio" src="{{ url_for('static', filename='audio/drill.mp3') }}" preload="auto"></audio>
</div>

<style>
    @keyframes tunnelFly {
        0% { transform: translate(-50%, -50%) translateZ(-1800px) rotate(0deg); opacity: 0; }
        8% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translate(-50%, -50%) translateZ(500px) rotate(25deg); opacity: 0; }
    }
    @keyframes drillSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    @keyframes drillVibrate {
        0%, 100% { transform: translate(0,0); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); }
        75% { transform: translate(-1px, -1px); }
    }
    @keyframes glowPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes screenShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
    }
    @keyframes dustParticle {
        0% { transform: translate(0,0) scale(1); opacity: 0.9; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    @keyframes alertGlow {
    0%, 100% { text-shadow: 0 0 0px rgba(239,68,68,0); }
    50% { text-shadow: 0 0 8px rgba(239,68,68,0.6); }
    }
    @keyframes dotGlowRed {
        0%, 100% { box-shadow: 0 0 0px rgba(239,68,68,0); }
        50% { box-shadow: 0 0 10px rgba(239,68,68,0.8); }
    }
    @keyframes dotGlowAmber {
        0%, 100% { box-shadow: 0 0 0px rgba(251,191,36,0); }
        50% { box-shadow: 0 0 8px rgba(251,191,36,0.7); }
    }
    .dot-glow-red { animation: dotGlowRed 1.5s ease-in-out infinite; }
    .dot-glow-amber { animation: dotGlowAmber 1.5s ease-in-out infinite; }
    .severity-glow {
        animation: alertGlow 2s ease-in-out infinite;
    }
    @keyframes valueFlash {
    0% { color: #fbbf24; }
    100% { color: inherit; }
    }
    .value-flash {
        animation: valueFlash 0.8s ease-out;
    }

    .tunnel-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
        animation: tunnelFly linear infinite;
    }
    #drill-svg.active #drill-spin {
        animation: drillSpin 0.25s linear infinite;
    }
    #drill-svg.active {
        animation: drillVibrate 0.08s linear infinite;
    }
    #center-glow.active {
        animation: glowPulse 0.8s ease-in-out infinite;
    }
    #drill-overlay.shaking {
        animation: screenShake 0.15s ease-in-out infinite;
    }
    .dust-particle {
        position: absolute;
        border-radius: 50%;
        animation: dustParticle 0.6s ease-out forwards;
    }
</style>

<script>
function buildTunnel() {
    const container = document.getElementById('tunnel-rings');
    container.innerHTML = '';
    const ringCount = 14;
    const colors = ['#44403c', '#292524', '#57534e', '#1c1917'];
    for (let i = 0; i < ringCount; i++) {
        const ring = document.createElement('div');
        ring.className = 'tunnel-ring';
        const size = 320 + (i % 3) * 40;
        ring.style.width = size + 'px';
        ring.style.height = size + 'px';
        ring.style.border = `${18 + (i % 2) * 6}px solid ${colors[i % colors.length]}`;
        ring.style.boxShadow = i % 3 === 0 ? '0 0 24px rgba(245,158,11,0.15)' : 'none';
        ring.style.animationDuration = '2.2s';
        ring.style.animationDelay = `-${(i / ringCount) * 2.2}s`;
        container.appendChild(ring);
    }
}

function spawnDust(count) {
    const container = document.getElementById('dust-container');
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'dust-particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 90;
        const size = 3 + Math.random() * 5;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = Math.random() > 0.7 ? '#fbbf24' : '#a8a29e';
        particle.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        particle.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        particle.style.left = '50%';
        particle.style.top = '50%';
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 700);
    }
}

function playDrillAnimation(onComplete) {
    const overlay = document.getElementById('drill-overlay');
    const audio = document.getElementById('drill-audio');
    const depthFill = document.getElementById('depth-fill');
    const depthLabel = document.getElementById('depth-label');
    const flash = document.getElementById('breakthrough-flash');
    const drillSvg = document.getElementById('drill-svg');
    const glow = document.getElementById('center-glow');

    overlay.classList.remove('hidden');
    overlay.classList.add('flex', 'shaking');
    drillSvg.classList.add('active');
    glow.classList.add('active');

    buildTunnel();

    audio.currentTime = 0;
    audio.play().catch(() => {});

    let dustInterval = setInterval(() => spawnDust(4), 180);

    let elapsed = 0;
    const totalDuration = 4800;
    const progressInterval = setInterval(() => {
        elapsed += 100;
        const pct = Math.min(100, (elapsed / totalDuration) * 100);
        depthFill.style.width = pct + '%';
        if (pct >= 100) clearInterval(progressInterval);
    }, 100);

    let skipped = false;
    function finish() {
        if (skipped) return;
        skipped = true;
        clearInterval(dustInterval);
        clearInterval(progressInterval);
        overlay.classList.remove('shaking');
        depthLabel.textContent = 'Breakthrough';
        flash.style.transition = 'opacity 0.35s ease-out';
        flash.style.opacity = '1';
        setTimeout(() => {
            audio.pause();
            if (onComplete) onComplete();
        }, 450);
    }

    const timer = setTimeout(finish, totalDuration + 100);

    function skipHandler() {
        clearTimeout(timer);
        finish();
        document.removeEventListener('keydown', skipHandler);
        overlay.removeEventListener('click', skipHandler);
    }
    document.addEventListener('keydown', skipHandler);
    overlay.addEventListener('click', skipHandler);
}
</script>
</body>
</html>
