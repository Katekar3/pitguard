{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-1 text-gray-500 hover:text-gray-300 text-sm transition-colors mb-8">
        ← Back
    </a>

    <div class="flex items-center justify-center" style="min-height: 60vh;">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <span class="text-4xl">⛏</span>
                <h1 class="text-2xl font-bold mt-2">PitGuard</h1>
                <p class="text-gray-500 text-sm">Underground safety monitoring</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="bg-red-950 border border-red-900 text-red-300 text-sm p-3 rounded-lg mb-4">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form id="login-form" class="space-y-3">
    <input type="text" name="username" placeholder="Username" required
           class="w-full p-3 rounded-lg bg-gray-900 border border-gray-800 focus:border-amber-600 focus:outline-none transition-colors">
    <input type="password" name="password" placeholder="Password" required
           class="w-full p-3 rounded-lg bg-gray-900 border border-gray-800 focus:border-amber-600 focus:outline-none transition-colors">
    <button type="submit"
            class="w-full bg-amber-600 hover:bg-amber-500 transition-colors p-3 rounded-lg font-medium">
        Log In
    </button>
</form>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    const response = await fetch('/login', {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });
    const data = await response.json();

    if (data.success) {
        playDrillAnimation(() => {
            window.location.href = '/dashboard';
        });
    } else {
        alert(data.message || 'Invalid username or password');
    }
});
</script>
        </div>
    </div>
</div>
{% endblock %}
